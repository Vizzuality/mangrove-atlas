name: release-please

# Releases are cut on develop only. main is a fast-forward mirror of develop
# (git merge --ff-only develop) so it never carries a unique release commit and
# the develop -> main fast-forward is always possible.
#
# Cadence: normal commits produce rc pre-releases (2.0.0-rc.0, 2.0.0-rc.1, ...).
# To graduate to a stable release, merge a commit with a `Release-As: 2.0.0`
# footer, which makes release-please cut the stable tag on the same line.

on:
  push:
    branches:
      - develop

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          target-branch: develop
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
